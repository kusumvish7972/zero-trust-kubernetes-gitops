apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-cluster-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/kusumvish7972/zero-trust-kubernetes-gitops.git'
    targetRevision: HEAD
    path: gitops/applications
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true